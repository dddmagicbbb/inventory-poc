# PR과 main push마다 로컬과 같은 검증을 실행한다
#   npm run verify = Prepare → Types → Lint → Architecture → Test → Build
name: Verify

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR·브랜치에 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI에는 .env가 없다. Prisma 설정(prisma.config.ts)이 읽을 DB 경로를 검증 DB로 지정한다.
      # (verify:prepare와 테스트는 스스로도 같은 경로를 지정한다 — scripts/verify-db.ts)
      DATABASE_URL: file:./prisma/verify.db
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify
