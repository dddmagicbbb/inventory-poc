name: 유지보수 작업
description: 에이전트가 바로 작업을 시작할 수 있도록 배경 · 변경 내용 · 종료 조건 · 기계 검증 · 변경 경계 · 재시도 한도를 정한다
title: "[유지보수] "
body:
  - type: markdown
    attributes:
      value: |
        이 Issue는 **작업 계약서**다. 에이전트는 여기 적힌 범위 안에서만 작업하고, 종료 조건과 기계 검증으로 완료를 판정한다.
        도메인 · 아키텍처 판단은 이 Issue가 아니라 원본(`docs/01-requirements.md`, `docs/06-architecture.md`)을 따른다. 둘이 충돌하면 에이전트는 `NEEDS_HUMAN`을 선언하고 멈춘다 (해제 절차: `docs/harness/SSOT.md` §7).

        진행 상태 · 결정 · 남은 질문 · 루프 횟수는 **이 Issue의 작업 기록 코멘트**에 남는다 (`docs/harness/Workflow.md` §3). 세션이 바뀌어도 이 Issue만 읽으면 이어갈 수 있어야 한다.

  - type: textarea
    id: background
    attributes:
      label: 1. 배경
      description: 왜 필요한가. 지금 무엇이 문제이고, 그대로 두면 어떻게 되는가.
      placeholder: |
        예) 출고 수량칸에 1.5를 붙여넣으면 소수점만 지워져 15개로 저장된다.
        현장에서 숫자를 복사해 넣는 경우가 있어 10배 출고가 기록될 수 있다.
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: 2. 변경할 내용
      description: 무엇을 수정하는가. 바꿀 동작과, 알고 있다면 관련 파일 · 함수를 적는다.
      placeholder: |
        예)
        - 수량 입력에 숫자가 아닌 문자가 섞이면 값을 바꾸지 않는다
        - 관련: src/components/QtyInput.tsx
    validations:
      required: true

  - type: textarea
    id: done-when
    attributes:
      label: 3. 종료 조건
      description: |
        무엇이 참이면 완료인가. 사람이 보고 참/거짓을 판단할 수 있는 문장으로 쓴다.
        예) `- [ ] 수량칸에 1.5를 입력하면 값이 바뀌지 않는다` · `- [ ] 정수 입력은 지금과 똑같이 동작한다`
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 4. 기계 검증
      description: |
        어떤 테스트가 판정하는가. `npm run verify` 통과는 기본이다.
        종료 조건은 `tests/issues/issue-{Issue 번호}-{기능명}.test.ts` 에서 **종료 조건 한 줄 = 테스트 하나**로 판정한다. 번호는 Issue가 만들어진 뒤 채운다.
      value: |
        - [ ] `npm run verify` 종료 코드 0 (Prepare → Types → Lint → Architecture → Test → Build)
        - [ ] 종료 조건 테스트: `tests/issues/issue-{번호}-{기능명}.test.ts` — 3번의 종료 조건을 모두 판정한다
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: 5. 건드리면 안 되는 것
      description: 변경 경계는 어디인가. 아래 보호 영역은 기본으로 포함된다. 이 작업에서 추가로 지켜야 할 파일 · 동작을 덧붙인다.
      value: |
        기본 보호 영역 (사람이 변경 · 승인)
        - 요구사항 · 아키텍처: `docs/01-requirements.md`, `docs/06-architecture.md`
        - 하네스 규칙: `docs/harness/`, `AGENTS.md`, `CLAUDE.md`
        - 검증 스크립트: `package.json`의 검증 단계, `scripts/verify-*.ts`, `scripts/check-architecture.ts`, `.github/workflows/`
        - 조건부: `prisma/seed.ts` · 기존 테스트의 기대값 — 바꾸면 근거를 작업 기록에 남긴다 (`docs/harness/SSOT.md` §8)

        이 작업에서 추가로 지킬 것
        -
    validations:
      required: true

  - type: dropdown
    id: max-loops
    attributes:
      label: 6. 구현 루프 최대 횟수
      description: 몇 번까지 재시도하는가. 구현 → 검증 한 바퀴가 1회다. 이 횟수 안에 종료 조건과 기계 검증을 통과하지 못하면 에이전트는 멈추고 사람에게 보고한다.
      options:
        - "1"
        - "2"
        - "3"
        - "5"
      default: 2
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: 7. 관련 원본
      description: 이 작업의 판단 근거가 되는 원본 절. 에이전트가 이 절부터 읽는다. 모르면 비워 둔다.
      placeholder: |
        예)
        - docs/06-architecture.md §4.2 로트 배분
        - docs/01-requirements.md §3 F9
    validations:
      required: false
